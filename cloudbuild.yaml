steps:
# 도커 이미지 빌드
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/pdf-splitter-repo/pdf-splitter:$COMMIT_SHA', '.']

# 이미지를 Artifact Registry에 푸시
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/pdf-splitter-repo/pdf-splitter:$COMMIT_SHA']

# Cloud Run에 서비스 배포
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'pdf-splitter-service'
  - '--image'
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/pdf-splitter-repo/pdf-splitter:$COMMIT_SHA'
  - '--region'
  - 'asia-northeast3'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--memory'
  - '512Mi'
  - '--cpu'
  - '1'
  - '--min-instances'
  - '0'
  - '--max-instances'
  - '10'

images:
- 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/pdf-splitter-repo/pdf-splitter:$COMMIT_SHA' 